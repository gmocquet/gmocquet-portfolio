name: deploy

# Release-driven: on every `v*` release tag, build the static site and deploy it to Cloudflare Pages
# via wrangler Direct Upload. CI and local use the SAME `make deploy` target (reproducibility).
# Tags are created by the release-tag workflow (on push to main). Requires the CLOUDFLARE_API_TOKEN /
# CLOUDFLARE_ACCOUNT_ID secrets and the PUBLIC_CF_BEACON_TOKEN variable.

on:
  push:
    tags:
      - v*

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://guillaumemocquet.com
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm --prefix frontend ci

      - name: Build and deploy to Cloudflare Pages
        run: make deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PUBLIC_CF_BEACON_TOKEN: ${{ vars.PUBLIC_CF_BEACON_TOKEN }}
