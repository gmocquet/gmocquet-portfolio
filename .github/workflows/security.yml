name: security

# Defense-in-depth secret scanning: run gitleaks over the FULL git history on every push to main and
# every pull request. GitHub's native secret scanning is free only on PUBLIC repos, so this guards the
# repo while it is private and stays a second layer once it is public. CI and local use the SAME
# `make secret-scan` target (single source of commands -> reproducibility).
# See docs/adrs/0011-secret-scanning-defense-in-depth.md.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history — scan every commit)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned)
        env:
          GITLEAKS_VERSION: 8.30.1 # keep in sync with the local version (make doctor)
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL "$url" -o /tmp/gitleaks.tar.gz
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan the full git history for secrets
        run: make secret-scan
