name: changelog

# On every new tag (vX.Y.Z), (re)generate CHANGELOG.md from Conventional Commits (grouped by
# category, commits oldest-first so the most recent is last) and commit it back to main with
# [skip ci] so it does not re-trigger the tag/deploy workflows.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: changelog
  cancel-in-progress: false

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (full history + tags)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Install git-cliff (pinned)
        run: pipx install git-cliff==2.13.1

      - name: Generate CHANGELOG.md
        run: git cliff --output CHANGELOG.md

      - name: Commit changelog (if changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- CHANGELOG.md; then
            git add CHANGELOG.md
            git commit -m "docs(changelog): update CHANGELOG.md [skip ci]"
            git push origin HEAD:main
          else
            echo "CHANGELOG.md unchanged — nothing to commit."
          fi
