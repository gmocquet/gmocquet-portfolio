name: changelog

# On every new tag (vX.Y.Z), (re)generate CHANGELOG.md from Conventional Commits (grouped by
# category, commits oldest-first so the most recent is last) and open a PR with the update.
# Using a PR (not a direct push) keeps `main` PR-only. The [skip ci] marker and the fact that a
# docs(changelog) commit does not bump the version both prevent release loops.

on:
  push:
    tags:
      - v*

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: changelog
  cancel-in-progress: false

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (full history + tags)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 0

      - name: Install git-cliff (pinned)
        run: pipx install git-cliff==2.13.1

      - name: Generate CHANGELOG.md
        run: git cliff --output CHANGELOG.md

      - name: Open changelog PR (if changed)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md unchanged — nothing to do."
            exit 0
          fi
          ref="${GITHUB_REF_NAME:-manual}"
          branch="chore/changelog-${ref}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add CHANGELOG.md
          git commit -m "docs(changelog): update for ${ref} [skip ci]"
          git push -f origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "docs(changelog): update for ${ref}" \
            --body "Automated CHANGELOG.md regeneration for \`${ref}\`. Merge to publish." \
            --label "type:docs" 2>/dev/null || echo "PR already exists for $branch."
