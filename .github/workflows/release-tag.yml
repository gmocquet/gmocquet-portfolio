name: release-tag

# On push to main, one purpose per job (two visible jobs), changelog BEFORE the tag:
#
#   job `changelog` — compute the next version from Conventional Commits (scripts/next-release-tag.sh;
#     breaking → MAJOR, feat → MINOR, else PATCH), regenerate CHANGELOG.md for it (git-cliff, PR/author
#     enriched via the API using GH_PAT_TOKEN), and commit it straight to main with the automatic
#     GITHUB_TOKEN. GitHub does NOT start workflow runs from GITHUB_TOKEN pushes (anti-recursion), so
#     this never re-triggers the workflow — no loop, no PR, no `[skip ci]`. Outputs the version and the
#     commit SHA to tag. Stops (empty output) when nothing is pending.
#
#   job `tag` — needs `changelog` and runs ONLY if it succeeded and produced a version. Creates and
#     pushes the v* tag on that SHA with the fine-grained PAT (GH_PAT_TOKEN). A PAT push is a real
#     identity, so it triggers deploy.yml (on: push tags v*). See ADR 0010.
#
# `persist-credentials: false` is required: otherwise actions/checkout leaves a GITHUB_TOKEN
# http.extraheader that overrides the PAT in the tag-push URL (the tag would push as GITHUB_TOKEN and
# never trigger deploy). Actions are SHA-pinned per repo policy.

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  changelog:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      sha: ${{ steps.cl.outputs.sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # full history + tags: version computation and changelog need them
          persist-credentials: false # no GITHUB_TOKEN extraheader; each push uses its explicit URL

      - name: Compute the next release version
        id: ver
        run: |
          tag="$(make --no-print-directory next-release-tag)"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if [ -n "$tag" ]; then echo "Next release: $tag"; else echo "Nothing to release."; fi

      - name: Install git-cliff (pinned)
        if: steps.ver.outputs.tag != ''
        run: pipx install git-cliff==2.13.1

      - name: Update CHANGELOG.md and push it to main (GITHUB_TOKEN — no workflow re-trigger)
        id: cl
        if: steps.ver.outputs.tag != ''
        env:
          GH_PAT_TOKEN: ${{ secrets.GH_PAT_TOKEN }} # git-cliff reads PR/author from the API (Pull requests: Read)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # push identity that does not re-trigger this workflow
        run: |
          make changelog TAG=${{ steps.ver.outputs.tag }}
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "CHANGELOG.md unchanged — committing nothing."
          else
            git commit -m "chore(release): ${{ steps.ver.outputs.tag }}"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  tag:
    needs: changelog
    if: needs.changelog.outputs.tag != '' # only when `changelog` succeeded and produced a version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.changelog.outputs.sha }} # the commit the changelog job left on main
          persist-credentials: false

      - name: Create and push the tag (PAT push — triggers deploy)
        env:
          GH_PAT_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
        run: |
          tag="${{ needs.changelog.outputs.tag }}"
          git tag "$tag"
          git push "https://x-access-token:${GH_PAT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$tag"
