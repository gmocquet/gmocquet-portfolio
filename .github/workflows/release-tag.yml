name: release-tag

# Based on anothrNick/github-tag-action — doc "example 1" (push to the default branch), adapted to
# this repo: branch `main`, `v` tag prefix (WITH_V) so the tag matches the deploy `v*` filter, patch
# bump by default. Uses ONLY secrets.GITHUB_TOKEN. Actions are SHA-pinned per repo policy.

on:
  push:
    branches:
      - main

jobs:
  tag:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: '0'

      - name: Bump version and push tag
        uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8 # v1.75.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: true
          RELEASE_BRANCHES: main
          DEFAULT_BUMP: patch
