name: release-tag

# On every push to main (i.e. after a PR merge), compute the next semantic version from the
# Conventional Commits since the last tag and create/push a vX.Y.Z tag. No-op if nothing releasable.
# Skipped for bot commits carrying [skip ci] (e.g. the changelog commit) to avoid CI loops.
# The tag is created via the GitHub REST API (POST /git/refs) with the default GITHUB_TOKEN — the
# same mechanism as anothrNick/github-tag-action — to test whether that triggers the deploy workflow.

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  tag:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Compute next tag
        id: ver
        run: |
          tag="$(./scripts/next-release-tag.sh)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Computed tag=${tag:-<none>}"

      - name: Create tag via the GitHub API (replicates github-tag-action)
        if: ${{ steps.ver.outputs.tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${{ steps.ver.outputs.tag }}" \
            -f sha="${GITHUB_SHA}"
