[project]
name = "portfolio-backend"
version = "0.1.0"
description = "Portfolio backend (FastAPI / Pydantic v2) — anticipated skeleton; implemented in Lot 2 (private area)."
readme = "README.md"
authors = [
    { name = "Guillaume MOCQUET", email = "gmocquet@sgea.io" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.138.0",
    "pydantic==2.13.4",
    "uvicorn==0.49.0",
]

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit==4.6.0",
    "pytest==9.1.1",
    "ruff==0.15.18",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # line length is handled by the formatter; do not flag long docstrings/strings
