- id: rue-du-commerce-product-pages
  title: Product pages re-architecture at e-commerce scale
  company: Rue du Commerce
  period: 2012–2015
  role: Engineering Manager
  summary: >-
    Led the team and the full re-architecture of the product pages — the most conversion-critical
    surface of a top French e-commerce platform (~€423M annual GMV, 6M monthly visitors) — into
    SEO-optimized microservices with REST APIs and multi-layer caching.
  outcomes:
    - Microservices exposing data via REST APIs on a template-engine front-end, SEO-optimized.
    - Low-latency rendering under heavy traffic — Redis hot data + CDN at the edge, with per-release asset invalidation.
    - Weeks after the Nov 2013 launch, the surface carried the company's all-time single-day sales record (~€5.2M group GMV at peak).
  stack: [Microservices, REST APIs, Redis, CDN, SEO, Template engine]
