- id: quantmetry-mlops-white-paper
  title: MLOps (re)training automation — white paper & talk
  company: Quantmetry (Capgemini Invent)
  period: "2019"
  role: Data & Solution Architect
  summary: >-
    Authored chapter 3 of Quantmetry's 5th white paper, "AI in production: life cycle & model
    drift" — "Scheduled updates & (re)training management" — covering MLOps (re)training automation
    across code, architecture and delivery, with a 20-minute companion talk.
  outcomes:
    - Published reference on operationalizing ML — model life cycle, drift detection and automated retraining.
    - Framed the architecture and delivery patterns that turn a model into a maintainable production system.
  stack: [MLOps, Model drift, CI/CD, Cloud architecture]
  media:
